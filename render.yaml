databases:
  - name: nexaflow-db
    databaseName: nexaflow
    user: nexaflow
    plan: free

services:
  - type: web
    name: nexaflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npm run db:deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexaflow-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
